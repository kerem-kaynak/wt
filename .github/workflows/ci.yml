name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck wt.sh examples/wt-setup.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats (and zsh on Linux)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bats-core
          else
            sudo apt-get update -q && sudo apt-get install -yq bats zsh
          fi
      - run: bats test
        env:
          WT_TEST_SHELL: ${{ matrix.shell }}
